<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Menu Example</title>
	<!-- top.css を適用 -->
	<link rel="stylesheet" href="./myLT.css">
	<script src="./myLT.js" defer></script>
</head>

<body>
	<!-- メニューの表示 -->
	<div class="menu">
		<div class="title">MENU</div>
		<ul class="nav">
			<li><a th:href="@{/myLT}">YOUR LT PROPERTY</a></li>
			<li><a th:href="@{/entry2}"> TUTORIAL</a></li>
			<li><a th:href="@{/max_heart_rate}">MEASUREMENT</a></li>
			<li><a th:href="@{/colum}">COLUM</a></li>
		</ul>
	</div>


	<!-- LT値を表示 -->
	<div class="current LT">
		<p>LT値: <span th:text="${yourLT}"></span></p>
	</div>

	<div id="mask"></div>

	<button id="open">LT値を入力する</button>

	<!-- LT値の入力 -->
	<form th:action="@{/insertLT}" method=POST>

		<!--		モータルウィンドウを表示-->

		<div id="insertLT" class="page.active">

			<input type="button" id="close" value="×">


			<ul><label for="LTHeartRate">LT値</label>
			</ul><input th:value="${LTHeartRate}" type="number" id="LTHeartRate" name="LTHeartRate">
			<ul><label for="currentDate">計測した日付</label>
			</ul><input th:value="${currentDate}" type="date" id="currentDate" name="currentDate">
			<br>
			<button type="submit" onclick="location.href='@{/myLT}'">登録する</button>
		</div>
	</form>
</body>

</html>
